name: Release to Modrinth

on:
  push:
    tags:
      - 'v*-mc*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-mc([0-9]+\.[0-9]+)$ ]]; then
            echo "Tag must use the vVERSION-mcMINECRAFT_VERSION format, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}-mc${BASH_REMATCH[2]}"
          tagged_minecraft_version="${BASH_REMATCH[2]}"
          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          if [[ "$minecraft_version" != "$tagged_minecraft_version" ]]; then
            echo "Tag targets Minecraft $tagged_minecraft_version but this branch builds $minecraft_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minecraft-version=$minecraft_version" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew --no-daemon build -Pversion="$RELEASE_VERSION"
          mkdir -p build/release
          find build/libs -maxdepth 1 -type f \
            -name "*-$RELEASE_VERSION.jar" \
            ! -name '*-sources.jar' \
            -exec cp {} build/release/ \;
          test "$(find build/release -type f -name '*.jar' | wc -l)" -eq 1

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/release/*.jar
          name: Deterministic Enchanting ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.version.outputs.minecraft-version }}